name: Release

# Cuts cross-platform binaries + sha256sums for every release. Two triggers:
#
#   - push to main → auto-release with CalVer "vYYYY.MM.DD-<short-sha>".
#     Mirrors simple-container-com/api's own release cadence (every merge
#     to main cuts a new sc release).
#   - manually-pushed "v*" tag → named release for pinning / rollback.
#
# Both paths produce the same artifact set: five binaries (linux/darwin
# amd64+arm64 + windows amd64), a sha256sums.txt, and a GitHub Release.
#
# Deliberately minimal: no cosign/SLSA in v1 — the operator-facing install
# path verifies via sha256sums.txt + GitHub's own commit attestation. Full
# signing follows when the plugin ecosystem has more than one repo.

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      is_tag:  ${{ steps.compute.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: compute
        name: Resolve version string
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true"               >> "$GITHUB_OUTPUT"
          else
            # CalVer with short SHA — same shape SC core uses.
            ver="v$(date -u +%Y.%m.%d)-$(git rev-parse --short=7 HEAD)"
            echo "version=${ver}"            >> "$GITHUB_OUTPUT"
            echo "is_tag=false"              >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved version: $(cat $GITHUB_OUTPUT | grep ^version=)"

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: version
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: plugin/go.sum

      - name: Build
        working-directory: plugin
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          out=sc-plugin-cloudflare-${GOOS}-${GOARCH}
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "../${out}" \
            ./cmd/sc-plugin-cloudflare
          sha256sum "../${out}" > "../${out}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            sc-plugin-cloudflare-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [version, build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build consolidated sha256sums.txt
        working-directory: dist
        run: |
          cat sc-plugin-cloudflare-*.sha256 > sha256sums.txt
          rm sc-plugin-cloudflare-*.sha256
          cat sha256sums.txt

      - name: Tag commit if from main
        if: needs.version.outputs.is_tag == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Push a lightweight tag so the Release is anchored. The tag already
          # has the right commit — this run was triggered by that commit.
          git tag "${VERSION}"
          git push origin "${VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --generate-notes \
            dist/*
