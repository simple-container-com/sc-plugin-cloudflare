name: Release

# Cut cross-platform binaries + sha256sums for every tag.
# Deliberately minimal — no cosign/SLSA in v1; the operator-facing install
# path verifies via sha256sums.txt + GitHub's own commit attestation.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: plugin/go.sum

      - name: Build
        working-directory: plugin
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          out=sc-plugin-cloudflare-${{ matrix.goos }}-${{ matrix.goarch }}
          [ "${{ matrix.goos }}" = windows ] && out="${out}.exe"
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "../${out}" \
            ./cmd/sc-plugin-cloudflare
          sha256sum "../${out}" > "../${out}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            sc-plugin-cloudflare-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build consolidated sha256sums.txt
        working-directory: dist
        run: |
          cat sc-plugin-cloudflare-*.sha256 > sha256sums.txt
          rm sc-plugin-cloudflare-*.sha256
          cat sha256sums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
